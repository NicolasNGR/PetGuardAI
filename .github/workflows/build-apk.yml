name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate Supabase build configuration
        run: |
          if [ -z "$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')" ]; then
            echo "::error::Configure the SUPABASE_URL GitHub Actions secret before building the APK."
            exit 1
          fi
          if [ -z "$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')" ]; then
            echo "::error::Configure the SUPABASE_ANON_KEY GitHub Actions secret before building the APK."
            exit 1
          fi
      - run: gradle assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: petguard-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
